{% extends 'products/base.html' %}{% block content %}
<h3>❤ My Wishlist - Save products</h3>
<div class="row">
{% for item in items %}
<div class="col-md-4 mb-3"><div class="card"><div class="card-body"><h6>{{ item.product.name }}</h6><p>₹{{ item.product.current_price }}</p><a href="/product/{{ item.product.id }}/" class="btn btn-sm btn-dark">View</a></div></div></div>
{% empty %}<p>No wishlist items</p>{% endfor %}
</div>
{% endblock %}
