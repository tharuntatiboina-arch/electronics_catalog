{% extends 'products/base.html' %}
{% block content %}
<div class="row">
<div class="col-md-3">
<form method="get" class="card p-3">
<h5>Filter</h5>
<input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search..." class="form-control mb-2">
<select name="brand" class="form-select mb-2">
<option value="">All Brands</option>
{% for b in brands %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
</select>
<select name="category" class="form-select mb-2">
<option value="">All Category</option>
{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
</select>
<input type="number" name="min_price" placeholder="Min Price" class="form-control mb-2">
<input type="number" name="max_price" placeholder="Max Price" class="form-control mb-2">
<button class="btn btn-primary w-100">Search</button>
</form>
</div>
<div class="col-md-9">
<div class="row">
{% for p in products %}
<div class="col-md-4 mb-4">
<div class="card h-100 shadow-sm">
<div class="card-body">
<h6>{{ p.name }}</h6>
<small class="text-muted">{{ p.brand.name }} | {{ p.processor }}</small>
<p class="fw-bold text-primary mt-2">₹{{ p.current_price }}</p>
<span class="badge bg-secondary">{{ p.ram }}</span>
<span class="badge bg-info">{{ p.category.name }}</span><br><br>
<a href="/product/{{ p.id }}/" class="btn btn-sm btn-dark w-100">View Details</a>
</div>
</div>
</div>
{% endfor %}
</div>
</div>
</div>
{% endblock %}
